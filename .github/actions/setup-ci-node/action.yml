name: Prepare cached Node dependencies
description: Set up Node 22 and reuse npm's download cache without requiring a lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Cache npm downloads
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-node22-npm-
    - name: Install project dependencies
      shell: bash
      run: npm install --no-audit --no-fund
