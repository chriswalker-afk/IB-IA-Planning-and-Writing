name: Geometry Studio browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/geometry-**'
      - 'src/diagrams/diagram-notation.js'
      - 'src/diagrams/representation-registry.js'
      - 'src/completing/views.js'
      - 'src/handover/**'
      - 'data/geometry-studio.css'
      - 'scripts/geometry-studio-browser.py'
      - '.github/workflows/geometry-studio-browser.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/geometry-**'
      - 'src/diagrams/diagram-notation.js'
      - 'data/geometry-studio.css'
      - 'scripts/geometry-studio-browser.py'
      - '.github/workflows/geometry-studio-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify Geometry Studio desktop and touch workflows
        run: |
          mkdir -p qa-output/geometry
          python -m http.server 8765 --directory dist > qa-output/geometry/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          IA_QA_OUTPUT=qa-output/geometry python scripts/geometry-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-studio-browser-results
          path: qa-output/geometry
          retention-days: 7
