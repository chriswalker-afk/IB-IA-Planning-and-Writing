name: Geometry Studio browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/geometry-**'
      - 'src/diagrams/diagram-notation.js'
      - 'src/diagrams/representation-registry.js'
      - 'src/completing/views.js'
      - 'src/handover/**'
      - 'data/geometry-studio.css'
      - 'scripts/geometry-studio-browser.py'
      - 'scripts/geometry-advanced-browser.py'
      - '.github/workflows/geometry-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/geometry-**'
      - 'src/diagrams/diagram-notation.js'
      - 'data/geometry-studio.css'
      - 'scripts/geometry-studio-browser.py'
      - 'scripts/geometry-advanced-browser.py'
      - '.github/workflows/geometry-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify Geometry Studio desktop and touch workflows
        run: |
          mkdir -p qa-output/geometry
          python -m http.server 8765 --directory dist > qa-output/geometry/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          IA_QA_OUTPUT=qa-output/geometry python scripts/geometry-studio-browser.py
          IA_QA_OUTPUT=qa-output/geometry python scripts/geometry-advanced-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-studio-browser-results
          path: qa-output/geometry
          retention-days: 7
