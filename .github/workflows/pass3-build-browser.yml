name: Published bundle browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build.mjs'
      - 'scripts/build-styles.mjs'
      - 'scripts/audit-deploy-assets.mjs'
      - '.github/workflows/pass3-build-browser.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - representation-pass5
          - graph-studio
          - stat-studio
          - chapter-onboarding
          - criteria-badges
          - report-exports
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build and verify published files
        run: |
          npm run build
          node scripts/audit-deploy-assets.mjs
      - uses: ./.github/actions/setup-ci-browser
      - name: Exercise published bundle on desktop and phone
        shell: bash
        run: |
          set -eu
          mkdir -p qa-output
          if [ "${{ matrix.suite }}" = report-exports ]; then
            python scripts/report-exports-browser.py
          else
            python -m http.server 8765 --directory dist > qa-output/site-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            IA_QA_OUTPUT="qa-output/pass3-${{ matrix.suite }}" \
              python "scripts/${{ matrix.suite }}-browser.py"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass3-${{ matrix.suite }}
          path: qa-output
          retention-days: 7
