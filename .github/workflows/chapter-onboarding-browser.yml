name: Chapter onboarding browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'src/completing/views.js'
      - 'src/completing/writer-field-guide.js'
      - 'data/chapter-onboarding.css'
      - 'tests/ui-smoke.test.js'
      - 'tests/writer-field-guide.test.js'
      - 'scripts/chapter-onboarding-browser.py'
      - '.github/workflows/chapter-onboarding-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'src/core/project-state.js'
      - 'src/ui/planning-views.js'
      - 'src/completing/views.js'
      - 'src/ui/living-journey.js'
      - 'src/ui/journey.js'
      - 'src/ui/journey-views.js'
      - 'data/chapter-onboarding.css'
      - 'data/living-journey.css'
      - 'tests/ui-smoke.test.js'
      - 'tests/planning-ui-coverage.test.js'
      - 'tests/living-journey.test.js'
      - 'scripts/chapter-onboarding-browser.py'
      - '.github/workflows/chapter-onboarding-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Check Planning and Set up on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/onboarding-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/chapter-onboarding-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-onboarding-browser-results
          path: qa-output
          retention-days: 7
