name: Illustrative sample quality browser acceptance
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/core/illustrative-samples.js'
      - 'src/core/sample-current-workflow.js'
      - 'src/core/sample-ia-document.js'
      - 'src/core/sample-library.js'
      - 'src/core/sample-document-model.js'
      - 'src/core/samples/**'
      - 'src/completing/entry-record.js'
      - 'src/diagrams/figure-linking.js'
      - 'src/handover/formats/docx.js'
      - 'data/sample-reader.css'
      - 'index.html'
      - 'src/handover/formats/pdf.js'
      - 'src/handover/figure-report.js'
      - 'scripts/illustrative-samples-browser.py'
      - '.github/workflows/illustrative-samples-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/core/illustrative-samples.js'
      - 'src/core/sample-current-workflow.js'
      - 'src/core/sample-ia-document.js'
      - 'src/core/sample-library.js'
      - 'src/core/sample-document-model.js'
      - 'src/core/samples/**'
      - 'src/completing/entry-record.js'
      - 'src/diagrams/figure-linking.js'
      - 'src/handover/formats/docx.js'
      - 'data/sample-reader.css'
      - 'index.html'
      - 'src/handover/formats/pdf.js'
      - 'src/handover/figure-report.js'
      - 'scripts/illustrative-samples-browser.py'
      - '.github/workflows/illustrative-samples-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sample-browser:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Data comparisons
            samples: standing-reach,helicopter-groups,revision-formats
          - group: Modelling I
            samples: grinder-reliability,stopping-distance,drink-cooling
          - group: Modelling II
            samples: tide-cycles,ball-clearance,tray-optimisation
          - group: Geometry
            samples: leaf-area,inaccessible-height
          - group: Decisions
            samples: water-stations,repayment-plans
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Check complete student examples, reader, exports and safe preview
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/illustrative-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 15 http://127.0.0.1:8765/ -o /dev/null
          IA_QA_SAMPLES="${{ matrix.samples }}" python scripts/illustrative-samples-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrative-samples-browser-${{ strategy.job-index }}
          path: qa-output
          retention-days: 7
