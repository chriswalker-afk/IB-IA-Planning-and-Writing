name: Native data entry browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/native-data-**'
      - 'src/diagrams/graph-**'
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/table-studio-**'
      - 'app.js'
      - 'index.html'
      - 'data/native-data-workspace.css'
      - 'src/core/project-state.js'
      - 'scripts/native-data-browser.py'
      - 'tests/native-data-workspace.test.js'
      - '.github/workflows/native-data-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'src/diagrams/native-data-**'
      - 'src/diagrams/graph-**'
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/table-studio-**'
      - 'app.js'
      - 'index.html'
      - 'data/native-data-workspace.css'
      - 'src/core/project-state.js'
      - 'scripts/native-data-browser.py'
      - 'tests/native-data-workspace.test.js'
      - '.github/workflows/native-data-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Node unit regressions and production build
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Test mouse, keyboard, local saving and mobile layout
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/native-data-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/native-data-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-data-browser-results
          path: qa-output
          retention-days: 7
