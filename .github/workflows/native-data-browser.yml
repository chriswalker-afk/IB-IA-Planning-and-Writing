name: Native data entry browser acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/diagrams/native-data-**'
      - 'src/diagrams/graph-**'
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/table-studio-**'
      - 'app.js'
      - 'index.html'
      - 'data/native-data-workspace.css'
      - 'src/core/project-state.js'
      - 'scripts/native-data-browser.py'
      - 'tests/native-data-workspace.test.js'
      - '.github/workflows/native-data-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node unit regressions and production build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test mouse, keyboard, local saving and mobile layout
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/native-data-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/native-data-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-data-browser-results
          path: qa-output
          retention-days: 7
