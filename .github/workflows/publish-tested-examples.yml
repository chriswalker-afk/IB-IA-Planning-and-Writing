name: Publish tested examples source
on:
  push:
    branches: [feature/paired-ia-examples-20261015]
    paths: ['.github/workflows/publish-tested-examples.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paired-ia-examples-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ia-examples-bootstrap-results
          run-id: 38683250287
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/tested-examples
      - name: Restore the exact tested application source
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,json
          qa=Path('/tmp/tested-examples')
          for name in ['examples-results.json','results.json','stuck-results.json','resources-results.json','ideas-results.json']:
              results=json.loads((qa/name).read_text())
              if isinstance(results,dict):
                  assert not results.get('browser_errors')
                  results=results['results']
              assert all(r['status']=='passed' for r in results),name
          files=['app.js','index.html','README.md','data/examples.css','src/completing/views.js','src/completing/guidance-views.js','src/ui/planning-views.js','src/help/stuck-views.js','tests/examples.test.js','tests/ui-smoke.test.js','tests/stuck.test.js','scripts/examples-fixtures.mjs','scripts/examples-browser.py','docs/examples-2026-10-15.md']
          files += ['src/examples/'+n+'.js' for n in ['catalog','context','controller','views','visuals']]
          with zipfile.ZipFile(qa/'source-snapshot.zip') as z:
              for name in files:
                  p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          p=Path('src/examples/context.js');s=p.read_text()
          old=" const entry=/^C35/.test(node||'')?entries.find(e=>e.id===nextId):entries[index];"
          new=" const mathematicalTask=route==='completing'&&/^C(?:3[0-5][A-Z]?|40[TDL]?|50)$/.test(node||'');\n const entry=mathematicalTask?(/^C35/.test(node||'')?entries.find(e=>e.id===nextId):entries[index]):undefined;"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('src/examples/views.js');s=p.read_text();lines=s.splitlines()
          matches=[i for i,l in enumerate(lines) if l.startswith(' const side=(good)=>')]
          assert len(matches)==1
          i=matches[0];old=lines[i]
          lines[i]=""" const side=(good)=>{
            const text=prose(good?(v?.strong||card.strong):card.weak),visual=visualFor(card,good,prefix+(good?'-good':'-weak'));
            const content=good&&card.id==='EX13'?text.replace('</p>','</p>'+visual):visual+text;
            return '<section class="ex-version '+(good?'ex-more':'ex-less')+'" aria-label="'+(good?'More effective':'Less effective')+'"><h4>'+(good?'More effective':'Less effective')+'</h4>'+content+'</section>';
           };"""
          p.write_text('\n'.join(lines)+'\n')
          p=Path('tests/examples.test.js')
          p.write_text(p.read_text()+"""
          test('old mathematical records do not override an introduction or conclusion',()=>{
           for(const node of ['C10','C60']){
            const s=state('statistics',node);s.entries[0].kind='theory';s.entries[0].methodId='proof';
            const x=exampleContext(s);assert.equal(x.kind,'statistics');assert.equal(x.entry,undefined);
            assert.equal(selectExamples(s)[0].id,node==='C10'?'EX02':'EX25');
           }
          });
          test('planning previews do not infer course familiarity from old entries',()=>{
           const s=state('statistics');s.route='planning';s.entries[0].kind='theory';s.entries[0].knowledge='outside';
           const x=exampleContext(s);assert.equal(x.mode,'Planning preview');assert.equal(x.knowledge,'');assert.equal(x.real,false);
           assert.equal(selectExamples(s)[0].id,'EX02');
          });
          test('mathematical presentation defines variables before the calculation',()=>{
           const html=renderCard(exampleById('EX13'));assert(html.indexOf('Let t be')<html.indexOf('<math '));
          });
          """)
          Path('/tmp/source-files.txt').write_text('\n'.join(files))
          PY
      - name: Verify unit regressions and production build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Commit only application files and remove package scaffolding
        run: |
          while IFS= read -r f || [ -n "$f" ]; do git add -- "$f"; done < /tmp/source-files.txt
          git rm scripts/ia-examples-part-*.b64 scripts/refine-examples.mjs
          git diff --cached --name-only
          if git diff --cached --name-only | grep '^.github/'; then echo 'Workflow writes intentionally excluded'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement 29 original contextual IA examples, visuals and read-only comparison library'
          git push origin HEAD:feature/paired-ia-examples-20261015
