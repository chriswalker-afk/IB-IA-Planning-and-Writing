name: Statistical Diagram Studio browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/box-analysis.js'
      - 'src/diagrams/distribution-analysis.js'
      - 'src/core/project-state.js'
      - 'src/completing/entry-record.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'index.html'
      - 'data/stat-studio.css'
      - 'tests/stat-studio.test.js'
      - 'tests/stat-studio-pass1.test.js'
      - 'tests/stat-studio-pass2.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/stat-studio-browser.py'
      - '.github/workflows/stat-studio-browser.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all mathematics and build site
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check statistics diagrams on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/stat-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/stat-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stat-studio-browser-results
          path: qa-output
          retention-days: 7
