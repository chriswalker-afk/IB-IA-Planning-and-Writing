name: Statistical Diagram Studio browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/box-analysis.js'
      - 'src/diagrams/distribution-analysis.js'
      - 'src/diagrams/stat-curve-analysis.js'
      - 'src/diagrams/stat-reading-guide.js'
      - 'src/diagrams/presentation-coach-core.js'
      - 'src/handover/figure-report.js'
      - 'src/diagrams/frequency-handover.js'
      - 'src/diagrams/table-studio-view.js'
      - 'src/core/project-state.js'
      - 'src/completing/entry-record.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'index.html'
      - 'data/stat-studio.css'
      - 'tests/stat-studio.test.js'
      - 'tests/stat-studio-pass1.test.js'
      - 'tests/stat-studio-pass2.test.js'
      - 'tests/stat-studio-pass3.test.js'
      - 'tests/stat-studio-pass4.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/stat-studio-browser.py'
      - '.github/workflows/stat-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/box-analysis.js'
      - 'src/diagrams/distribution-analysis.js'
      - 'src/diagrams/stat-curve-analysis.js'
      - 'src/diagrams/stat-reading-guide.js'
      - 'src/diagrams/presentation-coach-core.js'
      - 'src/handover/figure-report.js'
      - 'src/diagrams/frequency-handover.js'
      - 'src/diagrams/table-studio-view.js'
      - 'src/core/project-state.js'
      - 'src/completing/entry-record.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'index.html'
      - 'data/stat-studio.css'
      - 'tests/stat-studio.test.js'
      - 'tests/stat-studio-pass1.test.js'
      - 'tests/stat-studio-pass2.test.js'
      - 'tests/stat-studio-pass3.test.js'
      - 'tests/stat-studio-pass4.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/stat-studio-browser.py'
      - '.github/workflows/stat-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Test all mathematics and build site
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Check statistics diagrams on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/stat-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/stat-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stat-studio-browser-results
          path: qa-output
          retention-days: 7
