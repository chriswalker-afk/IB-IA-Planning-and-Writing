name: Table Studio browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagrams/table-studio-**'
      - 'src/core/project-state.js'
      - 'src/completing/entry-record.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'index.html'
      - 'data/table-studio.css'
      - 'data/representation-workspace.css'
      - 'tests/table-studio.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/table-studio-browser.py'
      - '.github/workflows/table-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/table-studio-**'
      - 'src/core/project-state.js'
      - 'src/completing/entry-record.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'index.html'
      - 'data/table-studio.css'
      - 'data/representation-workspace.css'
      - 'tests/table-studio.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/table-studio-browser.py'
      - '.github/workflows/table-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Test mathematical formats and build website
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Validate automatically sized tables on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/table-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/table-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-studio-browser-results
          path: qa-output
          retention-days: 7
