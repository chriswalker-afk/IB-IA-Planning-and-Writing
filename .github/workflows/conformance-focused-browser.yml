name: Focused conformance writing journeys
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/conformance-browser.py'
      - 'scripts/stuck-browser.py'
      - 'scripts/conformance-fixtures.mjs'
      - 'src/completing/**'
      - 'src/ui/**'
      - 'app.js'
      - '.github/workflows/conformance-focused-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/conformance-browser.py'
      - 'scripts/stuck-browser.py'
      - 'scripts/conformance-fixtures.mjs'
      - '.github/workflows/conformance-focused-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conformance-writing:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Unit tests and production build
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Exercise focused IA conformance journeys on desktop and phone
        run: |
          mkdir -p qa-output
          node scripts/conformance-fixtures.mjs
          python -m http.server 8765 --directory dist > qa-output/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          status=0
          python scripts/conformance-browser.py || status=1
          python scripts/stuck-browser.py || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-conformance-artifacts
          path: qa-output
          retention-days: 7
