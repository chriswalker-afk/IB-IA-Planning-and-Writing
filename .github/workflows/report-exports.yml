name: Report export browser checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/handover/**'
      - 'src/math/**'
      - 'src/core/project-state.js'
      - 'src/core/illustrative-samples.js'
      - 'src/core/sample-**'
      - 'src/diagrams/*-core.js'
      - 'src/diagrams/*-render.js'
      - 'src/diagrams/*-export.js'
      - 'src/diagrams/diagram-notation.js'
      - 'src/diagrams/figure-linking.js'
      - 'src/completing/first-figure-gallery.js'
      - 'src/completing/entry-record.js'
      - 'data/math-writing.css'
      - 'scripts/report-exports-browser.py'
      - 'scripts/sample-release-browser.py'
      - 'scripts/build-browser-vendor.mjs'
      - 'vendor/**'
      - 'pdf.worker.min.mjs'
      - '.github/workflows/report-exports.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  workflow_run:
    workflows: [Deploy IA Pathfinder]
    types: [completed]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reports:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-ci-node
      - name: Generate pinned, self-hosted browser libraries
        run: node scripts/build-browser-vendor.mjs
      - run: npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Test PDF, Word and ZIP downloads from the production bundle
        run: python scripts/report-exports-browser.py
      - name: Test the release chooser check against this build
        run: |
          python -m http.server 8767 --directory dist > qa-output/reports/chooser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 15 http://127.0.0.1:8767/ -o /dev/null
          IA_RELEASE_URL=http://127.0.0.1:8767/ python scripts/sample-release-browser.py
      - name: Verify published reports after deployment
        if: github.event_name == 'workflow_run'
        run: python scripts/report-exports-browser.py --live
      - name: Verify every published illustrative choice after deployment
        if: github.event_name == 'workflow_run'
        run: python scripts/sample-release-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-export-results
          path: qa-output/reports
          retention-days: 7
