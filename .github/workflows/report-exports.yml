name: Report export browser checks
on:
  workflow_dispatch:
  push:
    branches: [fix-report-exports-2026-10-15]
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Check built and published report buttons
        run: python scripts/report-exports-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-export-results
          path: qa-output/reports
          retention-days: 7
