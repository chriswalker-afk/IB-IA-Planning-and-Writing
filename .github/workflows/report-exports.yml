name: Report export browser checks
on:
  workflow_dispatch:
  push:
    branches: [fix-report-exports-2026-10-15]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Deploy IA Pathfinder]
    types: [completed]
permissions:
  contents: read
jobs:
  reports:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Generate pinned, self-hosted browser libraries
        run: node scripts/build-browser-vendor.mjs
      - run: npm test
      - run: npm run build
      - run: pip install playwright==1.57.0 pypdf==5.9.0
      - run: python -m playwright install --with-deps chromium
      - name: Test PDF, Word and ZIP downloads from the production bundle
        run: python scripts/report-exports-browser.py
      - name: Verify published reports after deployment
        if: github.event_name == 'workflow_run'
        run: python scripts/report-exports-browser.py --live
      - name: Record tested generated libraries on the repair branch
        if: github.ref == 'refs/heads/fix-report-exports-2026-10-15' && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor pdf.worker.min.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Include tested self-hosted report libraries for static Pages hosting'
            git push origin HEAD:fix-report-exports-2026-10-15
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-export-results
          path: qa-output/reports
          retention-days: 7
