name: Design workbench
on:
  push:
    branches: [design-cohesion-2026-10-15]
    paths: ['.github/workflows/design-workbench.yml', 'scripts/design-patch.py']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply reviewed design patch when present
        run: |
          if [ -f scripts/design-patch.py ]; then
            python scripts/design-patch.py
          fi
      - run: npm test
      - run: npm run build
      - name: Snapshot for local visual and interaction verification
        if: always()
        run: tar --exclude=.git -czf /tmp/design-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-source
          path: /tmp/design-source.tar.gz
          retention-days: 2
      - name: Commit applied source changes on the isolated branch
        run: |
          if [ -f scripts/design-patch.py ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git add src tests scripts docs data index.html styles.css README.md
            git reset -- node_modules package-lock.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'Apply focus, progress and interaction-cohesion passes'
              git push origin HEAD:design-cohesion-2026-10-15
            fi
          fi
