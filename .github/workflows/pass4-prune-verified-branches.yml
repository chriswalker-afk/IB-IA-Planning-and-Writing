             const check=await github.rest.repos.compareCommits({owner,repo,base:record.merge,head:baseline});
             if(!['identical','ahead'].includes(check.data.status))throw Error('Merge commit not in current main ancestry: '+branch);
             const b=await github.rest.repos.getBranch({owner,repo,branch});
             if(b.data.protected||b.data.commit.sha!==record.sha)throw Error('Protected or altered branch '+branch);
            }
            core.info('Preflight confirmed '+Object.keys(expected).length+' unchanged merged branches.');
            for(const [branch,record] of Object.entries(expected)){
             const ref=await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
             if(ref.data.object.sha!==record.sha)throw Error('Branch changed during cleanup: '+branch);
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
             core.info('Deleted merged branch '+branch+' (PR #'+record.pr+').');
            }
