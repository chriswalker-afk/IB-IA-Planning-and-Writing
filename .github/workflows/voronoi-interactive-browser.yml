name: Voronoi interactive browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/voronoi-**'
      - 'src/completing/views.js'
      - 'app.js'
      - 'data/representation-voronoi.css'
      - 'data/representation-workspace.css'
      - 'scripts/voronoi-interactive-browser.py'
      - 'tests/voronoi-interactions.test.js'
      - '.github/workflows/voronoi-interactive-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'src/diagrams/voronoi-**'
      - 'src/completing/views.js'
      - 'app.js'
      - 'data/representation-voronoi.css'
      - 'data/representation-workspace.css'
      - 'scripts/voronoi-interactive-browser.py'
      - 'tests/voronoi-interactions.test.js'
      - '.github/workflows/voronoi-interactive-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Unit tests and production build
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Click, drag, compare and export on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/voronoi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/voronoi-interactive-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voronoi-interactive-browser-results
          path: qa-output
          retention-days: 7
