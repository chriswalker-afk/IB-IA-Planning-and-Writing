name: Mathematical Journey browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/ui/math-constellation.js'
      - 'src/ui/living-journey.js'
      - 'src/ui/journey-views.js'
      - 'data/math-journey-v2.css'
      - 'data/living-journey.css'
      - 'index.html'
      - 'tests/living-journey.test.js'
      - 'scripts/living-journey-browser.py'
      - '.github/workflows/living-journey-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'src/ui/math-constellation.js'
      - 'src/ui/living-journey.js'
      - 'src/ui/journey-views.js'
      - 'data/math-journey-v2.css'
      - 'data/living-journey.css'
      - 'index.html'
      - 'tests/living-journey.test.js'
      - 'scripts/living-journey-browser.py'
      - '.github/workflows/living-journey-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Unit tests and build
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify mathematical journey on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/journey-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/living-journey-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematical-journey-browser-results
          path: qa-output
          retention-days: 7
