name: Mixed mathematics authoring browser acceptance
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/math/**'
      - 'src/handover/formats/pdf.js'
      - 'src/handover/formats/docx.js'
      - 'data/math-writing.css'
      - 'scripts/mixed-math-browser.py'
      - '.github/workflows/mixed-math-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/math/**'
      - 'src/handover/formats/pdf.js'
      - 'src/handover/formats/docx.js'
      - 'scripts/mixed-math-browser.py'
      - 'data/math-writing.css'
      - '.github/workflows/mixed-math-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  math-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Exercise mixed prose and mathematical exports on desktop and phone
        run: python scripts/mixed-math-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-math-browser-results
          path: qa-output/mixed-math
          retention-days: 7
