name: Deploy IA Pathfinder
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: ia-pathfinder-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare cached Node dependencies
        uses: ./.github/actions/setup-ci-node
      - name: Validate and build
        run: |
          npm test
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload bundled website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # If the repository still publishes Pages from the main branch, its
      # automatic "pages build and deployment" may finish after our bundled
      # deployment and replace dist/ with raw, unbundled source. Wait until
      # that competing deployment is finished before publishing the bundle.
      - name: Ensure bundled website wins over legacy Pages source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-legacy-pages-build.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
