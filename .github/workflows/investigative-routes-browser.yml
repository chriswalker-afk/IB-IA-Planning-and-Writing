name: Investigative routes browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/planning/investigative-routes.js'
      - 'src/ui/investigative-routes-view.js'
      - 'src/planning/engine.js'
      - 'data/investigative-routes.css'
      - 'scripts/investigative-routes-browser.py'
      - '.github/workflows/investigative-routes-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Install dependencies and build the website
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Exercise route discovery on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/routes-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/investigative-routes-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigative-routes-browser-screenshots
          path: qa-output
          retention-days: 7
