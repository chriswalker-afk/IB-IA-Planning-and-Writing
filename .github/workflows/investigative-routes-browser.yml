name: Investigative routes browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/planning/investigative-routes.js'
      - 'src/ui/investigative-routes-view.js'
      - 'src/planning/engine.js'
      - 'data/investigative-routes.css'
      - 'scripts/investigative-routes-browser.py'
      - '.github/workflows/investigative-routes-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and build the website
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium for responsive checks
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise route discovery on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/routes-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/investigative-routes-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigative-routes-browser-screenshots
          path: qa-output
          retention-days: 7
