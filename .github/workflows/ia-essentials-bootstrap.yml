name: Integrate and verify IA essentials
on:
  push:
    branches: [feature/ia-essentials-and-criteria-20261015]
    paths:
      - '.github/workflows/ia-essentials-bootstrap.yml'
      - 'scripts/refine-essentials.py'
permissions:
  contents: write
concurrency:
  group: ia-essentials-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed integration patch
        run: |
          mkdir -p qa-output
          python - <<'PY'
          import base64,lzma,json,hashlib,subprocess
          from pathlib import Path
          # The complete integration patch is the first JSON value in this staged source prefix.
          # Only that complete, checksummed value is used; later incomplete packaging is ignored.
          fragment=lzma.LZMADecompressor().decompress(base64.b64decode(Path('scripts/essentials-part-1.b64').read_text().strip(),validate=True)).decode()
          patch,end=json.JSONDecoder().raw_decode(fragment,fragment.index(':')+1)
          assert hashlib.sha256(patch.encode()).hexdigest()=='c81550e535c286a57cbd346eceead032f9186d4e6f53f2f897f168a377839d27'
          subprocess.run(['git','apply','--check','-'],input=patch,text=True,check=True)
          subprocess.run(['git','apply','-'],input=patch,text=True,check=True)
          PY
          python scripts/refine-essentials.py
      - run: npm install --no-audit --no-fund
      - name: Full unit and regression suite
        run: |
          set -o pipefail
          npm test | tee qa-output/unit-tests.log
      - name: Build production website
        run: |
          set -o pipefail
          npm run build | tee qa-output/build.log
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify new and existing desktop and phone journeys
        run: |
          node scripts/conformance-fixtures.mjs
          node scripts/examples-fixtures.mjs
          python -m http.server 8765 --directory dist > qa-output/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/essentials-browser.py
          python scripts/examples-browser.py
          python scripts/conformance-browser.py
          python scripts/stuck-browser.py
          python scripts/resources-browser.py
          python scripts/ideas-browser.py
      - name: Save evidence and exact tested source
        if: always()
        run: |
          mkdir -p qa-output
          git diff > qa-output/integration.diff
          git rev-parse HEAD > qa-output/tested-base.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('qa-output/source-snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if p.is_file() and not any(a in {'.git','node_modules','qa-output','__pycache__'} for a in p.parts):z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-essentials-verification
          path: qa-output
          retention-days: 7
      - name: Commit tested application source
        run: |
          rm scripts/essentials-part-1.b64 scripts/refine-essentials.py
          git add README.md app.js index.html scripts/examples-browser.py scripts/essentials-browser.py src/completing src/examples src/ui/planning-views.js src/essentials data/essentials.css tests/essentials.test.js tests/ui-smoke.test.js docs/essentials-and-criteria-2026-10-15.md
          git add -u scripts/essentials-part-1.b64 scripts/refine-essentials.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate source-based essentials, visible criterion prompts and safe self-review'
          git push origin HEAD:feature/ia-essentials-and-criteria-20261015
