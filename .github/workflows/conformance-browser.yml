name: Conformance browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'src/completing/**'
      - 'src/ui/**'
      - 'src/planning/**'
      - 'src/ideas/**'
      - 'src/resources/**'
      - 'src/essentials/**'
      - 'src/core/project-state.js'
      - 'src/core/illustrative-samples.js'
      - 'src/handover/**'
      - 'data/experience.css'
      - 'data/representation-workspace.css'
      - 'scripts/*-browser.py'
      - '.github/workflows/conformance-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Prepare browser artifact directory
        run: mkdir -p qa-output
      - run: npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Desktop and phone acceptance journeys
        run: |
          node scripts/conformance-fixtures.mjs
          node scripts/examples-fixtures.mjs
          node scripts/experience-fixtures.mjs
          python -m http.server 8765 --directory dist > qa-output/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          status=0
          for suite in conformance stuck resources ideas examples essentials experience timeline criterion-level illustrative-samples math-routes extended-routes living-journey; do
            python "scripts/$suite-browser.py" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-browser-results
          path: qa-output
          retention-days: 7
