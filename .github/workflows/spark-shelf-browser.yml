name: Spark shelf browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ui/insight-threads.js'
      - 'src/ui/planning-views.js'
      - 'src/completing/views.js'
      - 'data/spark-shelf.css'
      - 'scripts/spark-shelf-browser.py'
      - '.github/workflows/spark-shelf-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Install dependencies and build website
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify responsive contextual sparks and edits
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/spark-shelf-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-shelf-browser-results
          path: qa-output
          retention-days: 7
