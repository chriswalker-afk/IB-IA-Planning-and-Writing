name: One-time obsolete branch cleanup
on:
  push:
    branches: [feature/full-project-export-20261015]
    paths: [.github/workflows/obsolete-branch-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove verified obsolete branches, retaining main and this feature
        uses: actions/github-script@v7
        with:
          script: |
            const expected = {"conformance/2026-10-15":"48912af3584ea05a9ed7b27055eb57dd7e50ee6f","design-cohesion-2026-10-15":"0ee9a25d5e70b1838351821d21867816c628bb20","feature/ia-essentials-and-criteria-20261015":"27f5645eedbf69e71c4a8f898e8fcf2fd0fd5708","feature/paired-ia-examples-20261015":"f504665b69051306f729d4904c52af345d184374","fix-report-exports-2026-10-15":"f869cb1d40982d1f3ed783a528f7fa4edae4fffa","help/stuck-2026-10-15":"b95a6ab3316d64079fd3845b60c169785984fec7","ideas/2026-10-15":"adb4bb752d52481a011234f188f6d649774c6db6","resources/2026-10-15":"db68069086d2cda743a1b94010ab8ca5c8a16e40"};
            const {owner,repo}=context.repo;
            const main=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(main.data.commit.sha!=='05fde5c01fec5d0d7dd1209f6a349c80c20fe805')throw Error('Main has moved; re-audit before cleanup');
            for(const [branch,sha] of Object.entries(expected)){
              const ref=await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
              if(ref.data.object.sha!==sha)throw Error(branch+' has changed; cleanup stopped');
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+branch});
              core.info('Removed obsolete '+branch);
            }
