name: IB presentation coach browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/presentation-coach-**'
      - 'src/diagrams/representation-hub.js'
      - 'src/diagrams/graph-**'
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/table-studio-**'
      - 'src/diagrams/image-tracer-**'
      - 'src/diagrams/voronoi-**'
      - 'src/completing/views.js'
      - 'app.js'
      - 'data/presentation-coach.css'
      - 'scripts/presentation-coach-browser.py'
      - 'tests/presentation-coach.test.js'
      - '.github/workflows/presentation-coach-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'src/diagrams/presentation-coach-**'
      - 'src/diagrams/representation-hub.js'
      - 'src/diagrams/graph-**'
      - 'src/diagrams/stat-studio-**'
      - 'src/diagrams/table-studio-**'
      - 'src/diagrams/image-tracer-**'
      - 'src/diagrams/voronoi-**'
      - 'src/completing/views.js'
      - 'app.js'
      - 'data/presentation-coach.css'
      - 'scripts/presentation-coach-browser.py'
      - 'tests/presentation-coach.test.js'
      - '.github/workflows/presentation-coach-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Test diagram guidance, saved captions and mobile writing journey
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/presentation-coach-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/presentation-coach-browser.py
          python scripts/living-journey-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-coach-browser-results
          path: qa-output
          retention-days: 7
