name: Sampling and precision browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/planning/data-decisions.js'
      - 'src/planning/primary-quantities.js'
      - 'src/ui/data-decisions-view.js'
      - 'src/ui/primary-data-steps.js'
      - 'data/primary-data-steps.css'
      - 'tests/primary-data-steps.test.js'
      - 'data/data-decisions.css'
      - 'scripts/data-decisions-browser.py'
      - '.github/workflows/data-decisions-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies, test and build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check sampling and data precision on desktop and mobile
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/data-methods-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/data-decisions-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-decisions-browser-results
          path: qa-output
          retention-days: 7
