name: Sampling and precision browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/ui/planning-views.js'
      - 'data/experience.css'
      - 'tests/ui-smoke.test.js'
      - 'tests/planning-ui-coverage.test.js'
      - 'src/planning/data-decisions.js'
      - 'src/planning/primary-quantities.js'
      - 'src/ui/data-decisions-view.js'
      - 'src/ui/primary-data-steps.js'
      - 'data/primary-data-steps.css'
      - 'tests/primary-data-steps.test.js'
      - 'data/data-decisions.css'
      - 'scripts/data-decisions-browser.py'
      - '.github/workflows/data-decisions-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Install dependencies, test and build
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Check sampling and data precision on desktop and mobile
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/data-methods-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/data-decisions-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-decisions-browser-results
          path: qa-output
          retention-days: 7
