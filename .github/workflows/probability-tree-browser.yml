name: Probability Tree Studio browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/probability-**'
      - 'src/diagrams/representation-**'
      - 'src/core/project-state.js'
      - 'src/completing/**'
      - 'src/handover/**'
      - 'data/probability-studio.css'
      - 'scripts/probability-tree-browser.py'
      - '.github/workflows/probability-tree-browser.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/probability-**'
      - 'src/diagrams/representation-**'
      - 'src/core/project-state.js'
      - 'data/probability-studio.css'
      - 'scripts/probability-tree-browser.py'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify probability tree editing, validation, mobile and saved exports
        run: |
          mkdir -p qa-output/probability
          python -m http.server 8765 --directory dist > qa-output/probability/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          IA_QA_OUTPUT=qa-output/probability python scripts/probability-tree-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-tree-browser-results
          path: qa-output/probability
          retention-days: 7
