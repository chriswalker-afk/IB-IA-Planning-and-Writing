name: Probability Tree Studio browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/probability-**'
      - 'src/diagrams/representation-**'
      - 'src/core/project-state.js'
      - 'src/completing/**'
      - 'src/handover/**'
      - 'data/probability-studio.css'
      - 'scripts/probability-tree-browser.py'
      - '.github/workflows/probability-tree-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'src/diagrams/probability-**'
      - 'src/diagrams/representation-**'
      - 'src/core/project-state.js'
      - 'data/probability-studio.css'
      - 'scripts/probability-tree-browser.py'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify probability tree editing, validation, mobile and saved exports
        run: |
          mkdir -p qa-output/probability
          python -m http.server 8765 --directory dist > qa-output/probability/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          IA_QA_OUTPUT=qa-output/probability python scripts/probability-tree-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probability-tree-browser-results
          path: qa-output/probability
          retention-days: 7
