name: Graph Studio browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagrams/graph-**'
      - 'src/diagrams/continuous-**'
      - 'src/diagrams/native-data-**'
      - 'src/diagrams/diagram-notation.js'
      - 'src/diagrams/representation-registry.js'
      - 'src/diagrams/figure-linking.js'
      - 'src/completing/views.js'
      - 'src/completing/engine.js'
      - 'src/completing/entry-record.js'
      - 'src/core/project-state.js'
      - 'app.js'
      - 'index.html'
      - 'data/graph-studio.css'
      - 'tests/graph-studio.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/graph-studio-browser.py'
      - '.github/workflows/graph-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/graph-**'
      - 'src/diagrams/continuous-**'
      - 'src/diagrams/native-data-**'
      - 'src/diagrams/diagram-notation.js'
      - 'src/diagrams/representation-registry.js'
      - 'src/diagrams/figure-linking.js'
      - 'src/completing/views.js'
      - 'src/completing/engine.js'
      - 'src/completing/entry-record.js'
      - 'src/core/project-state.js'
      - 'app.js'
      - 'index.html'
      - 'data/graph-studio.css'
      - 'tests/graph-studio.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/graph-studio-browser.py'
      - '.github/workflows/graph-studio-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify graphs and exports on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/graph-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/graph-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-studio-browser-results
          path: qa-output
          retention-days: 7
