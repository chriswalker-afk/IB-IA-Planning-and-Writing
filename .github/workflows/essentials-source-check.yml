name: Essentials source verification
on:
  push:
    branches: [feature/ia-essentials-and-criteria-20261015]
    paths: ['.github/workflows/essentials-source-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture the exact source and staged patch
        run: |
          mkdir -p qa-output
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,zipfile
          p=Path('scripts/essentials-part-1.b64')
          dec=lzma.LZMADecompressor()
          data=dec.decompress(base64.b64decode(p.read_text().strip()))
          Path('qa-output/staged-source-fragment.txt').write_bytes(data)
          with zipfile.ZipFile('qa-output/exact-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in Path('.').rglob('*'):
                  if f.is_file() and not any(k in {'.git','qa-output'} for k in f.parts):
                      z.write(f,f.as_posix())
          print('Recovered source prefix length:',len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essentials-source-verification
          path: qa-output
          retention-days: 7
