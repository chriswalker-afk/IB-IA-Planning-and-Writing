name: Image tracer browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/diagrams/image-tracer-**'
      - 'src/completing/views.js'
      - 'src/completing/entry-record.js'
      - 'src/core/project-state.js'
      - 'app.js'
      - 'index.html'
      - 'data/image-tracer.css'
      - 'tests/image-tracer.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/image-tracer-browser.py'
      - '.github/workflows/image-tracer-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/diagrams/image-tracer-**'
      - 'src/completing/views.js'
      - 'src/completing/entry-record.js'
      - 'src/core/project-state.js'
      - 'app.js'
      - 'index.html'
      - 'data/image-tracer.css'
      - 'tests/image-tracer.test.js'
      - 'tests/ui-smoke.test.js'
      - 'scripts/image-tracer-browser.py'
      - '.github/workflows/image-tracer-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build browser distribution
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Check image tracing on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/image-tracer-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/image-tracer-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-tracer-browser-results
          path: qa-output
          retention-days: 7
