name: Criteria badge pop-in acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/essentials/criteria-badges.js'
      - 'src/essentials/views.js'
      - 'src/ui/planning-views.js'
      - 'src/completing/views.js'
      - 'data/criteria-badges.css'
      - 'tests/criteria-badges.test.js'
      - 'scripts/criteria-badges-browser.py'
      - '.github/workflows/criteria-badges-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site and run unit tests
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Install Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify criteria pop-ins on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/criteria-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/criteria-badges-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criteria-badge-browser-results
          path: qa-output
          retention-days: 7
