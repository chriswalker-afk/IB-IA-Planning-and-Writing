name: Criteria badge pop-in acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/criteria-badges-browser.py'
      - '.github/workflows/criteria-badges-browser.yml'
      - 'src/essentials/**'
      - 'src/completing/views.js'
      - 'src/ui/planning-views.js'
  push:
    branches: [main]
    paths:
      - 'src/essentials/criteria-badges.js'
      - 'src/essentials/assessment-cohorts.js'
      - 'src/essentials/checking-criterion-spots.js'
      - 'src/checking/views.js'
      - 'src/planning/engine.js'
      - 'app.js'
      - 'data/checking.css'
      - 'tests/assessment-cohorts.test.js'
      - 'tests/checking-page.test.js'
      - 'tests/ui-smoke.test.js'
      - 'src/handover/schema.js'
      - 'src/essentials/criteria-badge-guidance.js'
      - 'src/essentials/later-maths-criterion-guidance.js'
      - 'src/essentials/criterion-opportunities.js'
      - 'tests/criterion-opportunities.test.js'
      - 'src/essentials/later-maths-criterion-spots.js'
      - 'src/essentials/views.js'
      - 'src/ui/planning-views.js'
      - 'src/completing/views.js'
      - 'data/criteria-badges.css'
      - 'tests/criteria-badges.test.js'
      - 'scripts/criteria-badges-browser.py'
      - '.github/workflows/criteria-badges-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build site and run unit tests
        run: |
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify criteria pop-ins on desktop and phone
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/criteria-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/criteria-badges-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criteria-badge-browser-results
          path: qa-output
          retention-days: 7
