name: Writer's Field Guide — advice-preservation browser acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/completing/writer-*.js'
      - 'src/completing/intro-writing-advice.js'
      - 'src/completing/first-maths-bridge.js'
      - 'src/completing/showing-first-maths.js'
      - 'src/completing/studio-writing-stages.js'
      - 'src/completing/mathematical-story-guidance.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'data/writer-guide-popin.css'
      - 'data/chapter-onboarding.css'
      - 'scripts/writer-advice-browser.py'
      - 'tests/writer-stage-advice.test.js'
      - 'tests/mathematical-story-guidance.test.js'
      - 'tests/completing-views.test.js'
      - '.github/workflows/writer-advice-browser.yml'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
  push:
    branches: [main]
    paths:
      - 'src/completing/writer-*.js'
      - 'src/completing/intro-writing-advice.js'
      - 'src/completing/first-maths-bridge.js'
      - 'src/completing/showing-first-maths.js'
      - 'src/completing/studio-writing-stages.js'
      - 'src/completing/mathematical-story-guidance.js'
      - 'src/completing/views.js'
      - 'app.js'
      - 'data/writer-guide-popin.css'
      - 'data/chapter-onboarding.css'
      - 'scripts/writer-advice-browser.py'
      - 'tests/writer-stage-advice.test.js'
      - 'tests/mathematical-story-guidance.test.js'
      - 'tests/completing-views.test.js'
      - '.github/actions/setup-ci-node/action.yml'
      - '.github/actions/setup-ci-browser/action.yml'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-writing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-node
      - name: Build and verify lossless writing advice
        run: |
          node --test tests/writer-stage-advice.test.js tests/writer-field-guide.test.js tests/mathematical-story-guidance.test.js tests/completing-views.test.js
          npm run build
      - uses: ./.github/actions/setup-ci-browser
      - name: Verify focused Writer Guide and complete tip library
        run: |
          mkdir -p qa-output
          python -m http.server 8765 --directory dist > qa-output/writer-advice-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/writer-advice-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-advice-browser-results
          path: qa-output
          retention-days: 7
